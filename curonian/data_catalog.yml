# HydroMT 0.10 data catalogue for the Curonian Lagoon SFINCS model.
# Raw sources are absolute on this machine and read-only; the project's own inputs are
# relative to this file (root: .), so the checkout can be renamed or cloned anywhere.
meta:
  root: .
  version: 2026-09-04

dem_5m:
  data_type: RasterDataset
  driver: raster
  path: /home/razinka/telemac/data/LowerNEMUNASdem_5m.tif
  crs: 3346
  nodata: -9999
  rename:
    LowerNEMUNASdem_5m: elevtn
  meta:
    category: topography
    notes: 5 m DEM of the lower Nemunas; flat 0 inside the lagoon, absent on the Spit. Hydromt logs a "CRS does not match" warning because the file's WKT is non-canonical LKS-94; this is benign.

lagoon_bathy_50m:
  data_type: RasterDataset
  driver: raster
  path: inputs/lagoon_bathy_50m.tif
  crs: 3346
  nodata: -9999
  rename:
    lagoon_bathy_50m: elevtn
  meta:
    category: bathymetry
    notes: interpolated from ~/curonian/isobates.gpkg by prep/make_bathymetry.py

emodnet_2022:
  data_type: RasterDataset
  driver: netcdf
  path: /home/razinka/telemac/Curonian/data/curonian_bathymetry_hires.nc
  crs: 4326
  rename:
    elevation: elevtn
  meta:
    category: bathymetry
    notes: EMODnet 2022 subset; fallback only (Spit land, Baltic outside the strait)

lagoon_boundary:
  data_type: GeoDataFrame
  driver: vector
  path: /home/razinka/curonian/curonian_db.gpkg
  driver_kwargs:
    layer: lagoon_boundary
  crs: 3346

channels:
  data_type: GeoDataFrame
  driver: vector
  path: inputs/channels.geojson
  crs: 3346

channel_bed:
  data_type: GeoDataFrame
  driver: vector
  path: inputs/channel_bed.geojson
  crs: 3346
  meta:
    category: bathymetry
    notes: per-segment river-bed levels (rivbed) from prep/derive_channel_bed.py; DEM thalweg for atmata/skirvyte floored at their old constant, strait unchanged at -12.0. Consumed per-channel by build_model.datasets_riv() (split into one point_zb entry per channel, not read via this catalogue key directly) -- see fix-distributary-bed-report.md for why a single combined point_zb entry corrupted the strait's burn.

active_region:
  data_type: GeoDataFrame
  driver: vector
  path: inputs/active_region.geojson
  crs: 3346

boundary_ring:
  data_type: GeoDataFrame
  driver: vector
  path: inputs/boundary_ring.geojson
  crs: 3346
