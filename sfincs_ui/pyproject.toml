[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfincs-ui"
version = "0.1.0"
description = "Build, run and inspect SFINCS models from the browser (laguna.ku.lt)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0"}
dependencies = [
    "shiny>=1.8.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sfincs_ui*"]

[tool.setuptools.package-data]
sfincs_ui = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "www/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not model_env'"
markers = ["model_env: needs the hydromt-sfincs micromamba env; deselected by default"]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error:datetime.datetime.utcnow:DeprecationWarning"]
