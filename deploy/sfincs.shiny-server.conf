# SFINCS Curonian Lagoon viewer — Shiny Server location block.
#
# Installed by deploy/deploy.sh into /etc/shiny-server/shiny-server.conf,
# immediately before the DEFAULT FALLBACK block (order matters: the fallback
# `location /` would otherwise swallow the request).
#
# Python Shiny apps REQUIRE the explicit `python` directive; without it Shiny
# Server treats the directory as an R app and the request 500s.

  location /sfincs {
    app_dir /srv/shiny-server/sfincs;
    python /opt/micromamba/envs/shiny/bin/python3;
    log_dir /var/log/shiny-server;
  }
